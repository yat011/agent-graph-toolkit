[project]
name = "agentgraph-engine"
version = "0.1.0"
description = "LangGraph-based execution engine for agent-graph-toolkit (replaces graph.md/run-graph.js)."
requires-python = ">=3.13"
dependencies = [
  "langgraph>=0.2.60",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "grandalf>=0.8",
  "textual>=8.2.8",
]

[project.scripts]
agentgraph = "agentgraph_engine.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentgraph_engine"]
